<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .tasks-grid {
            display: grid;
            gap: 15px;
        }

        .task-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .task-card.priority-LOW { border-left-color: #28a745; }
        .task-card.priority-MEDIUM { border-left-color: #ffc107; }
        .task-card.priority-HIGH { border-left-color: #ff6b6b; }
        .task-card.priority-URGENT { border-left-color: #dc3545; }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .task-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .task-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-status {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-status.TODO { background: #fff3cd; color: #856404; }
        .badge-status.IN_PROGRESS { background: #cce5ff; color: #004085; }
        .badge-status.COMPLETED { background: #d4edda; color: #155724; }
        .badge-status.CANCELLED { background: #f8d7da; color: #721c24; }

        .badge-priority {
            background: #f5f5f5;
            color: #333;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #667eea;
            color: white;
        }

        .btn-edit:hover {
            background: #5568d3;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Task Management System</h1>
            <p>Organize your work efficiently</p>
        </header>

        <div class="main-content">
            <!-- Create/Edit Task Form -->
            <div class="card">
                <h2 id="form-title">Create New Task</h2>
                <div id="message"></div>
                
                <form id="taskForm">
                    <input type="hidden" id="taskId">
                    
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" required placeholder="Enter task title">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Enter task description"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" required>
                            <option value="TODO">To Do</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority *</label>
                        <select id="priority" required>
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                            <option value="URGENT">Urgent</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">Create Task</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Cancel Edit</button>
                </form>
            </div>

            <!-- Tasks List -->
            <div class="card">
                <h2>Your Tasks</h2>
                
                <div class="filters">
                    <button class="filter-btn active" data-filter="ALL">All</button>
                    <button class="filter-btn" data-filter="TODO">To Do</button>
                    <button class="filter-btn" data-filter="IN_PROGRESS">In Progress</button>
                    <button class="filter-btn" data-filter="COMPLETED">Completed</button>
                </div>

                <div id="tasksContainer">
                    <div class="loading">Loading tasks...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL
        const API_URL = 'http://localhost:8080/api/tasks';
        
        let currentFilter = 'ALL';
        let editingTaskId = null;

        // Load tasks on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            setupEventListeners();
        });

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('taskForm').addEventListener('submit', handleSubmit);
            document.getElementById('cancelBtn').addEventListener('click', cancelEdit);
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    loadTasks();
                });
            });
        }

        // Load all tasks
        async function loadTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '<div class="loading">Loading tasks...</div>';

            try {
                let url = API_URL;
                if (currentFilter !== 'ALL') {
                    url = `${API_URL}/status/${currentFilter}`;
                }

                const response = await fetch(url);
                const tasks = await response.json();

                if (tasks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
                                <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
                            </svg>
                            <h3>No tasks found</h3>
                            <p>Create your first task to get started!</p>
                        </div>
                    `;
                } else {
                    displayTasks(tasks);
                }
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading tasks: ${error.message}</div>`;
            }
        }

        // Display tasks
        function displayTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '<div class="tasks-grid">' + 
                tasks.map(task => createTaskCard(task)).join('') + 
            '</div>';

            // Add event listeners to action buttons
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => editTask(btn.dataset.id));
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteTask(btn.dataset.id));
            });
        }

        // Create task card HTML
        function createTaskCard(task) {
            return `
                <div class="task-card priority-${task.priority}">
                    <div class="task-header">
                        <div class="task-title">${task.title}</div>
                    </div>
                    <div class="task-description">${task.description || 'No description'}</div>
                    <div class="task-meta">
                        <span class="badge badge-status ${task.status}">${task.status.replace('_', ' ')}</span>
                        <span class="badge badge-priority">${task.priority}</span>
                    </div>
                    <div class="task-actions">
                        <button class="btn-small btn-edit" data-id="${task.id}">Edit</button>
                        <button class="btn-small btn-delete" data-id="${task.id}">Delete</button>
                    </div>
                </div>
            `;
        }

        // Handle form submit (Create or Update)
        async function handleSubmit(e) {
            e.preventDefault();

            const task = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                status: document.getElementById('status').value,
                priority: document.getElementById('priority').value
            };

            try {
                let response;
                if (editingTaskId) {
                    // Update existing task
                    response = await fetch(`${API_URL}/${editingTaskId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(task)
                    });
                } else {
                    // Create new task
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(task)
                    });
                }

                if (response.ok) {
                    showMessage(editingTaskId ? 'Task updated successfully!' : 'Task created successfully!', 'success');
                    resetForm();
                    loadTasks();
                } else {
                    const error = await response.json();
                    showMessage('Error: ' + (error.message || 'Something went wrong'), 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Edit task
        async function editTask(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const task = await response.json();

                editingTaskId = id;
                document.getElementById('title').value = task.title;
                document.getElementById('description').value = task.description || '';
                document.getElementById('status').value = task.status;
                document.getElementById('priority').value = task.priority;

                document.getElementById('form-title').textContent = 'Edit Task';
                document.getElementById('submitBtn').textContent = 'Update Task';
                document.getElementById('cancelBtn').style.display = 'block';

                // Scroll to form
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                showMessage('Error loading task: ' + error.message, 'error');
            }
        }

        // Delete task
        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Task deleted successfully!', 'success');
                    loadTasks();
                } else {
                    showMessage('Error deleting task', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Cancel edit
        function cancelEdit() {
            resetForm();
        }

        // Reset form
        function resetForm() {
            document.getElementById('taskForm').reset();
            editingTaskId = null;
            document.getElementById('form-title').textContent = 'Create New Task';
            document.getElementById('submitBtn').textContent = 'Create Task';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Show message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = text;
            
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }, 3000);
        }
    </script>
</body>
</html>
